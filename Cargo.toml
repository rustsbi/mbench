[workspace]
resolver = "3"
members = [
    "crates/mbench-core",
    "crates/mbench-target",
    "crates/mbench-cli",
]
# Keep default cargo test/clippy on host-testable safe crates; build mbench-target
# explicitly for `riscv64imac-unknown-none-elf`.
default-members = [
    "crates/mbench-core",
    "crates/mbench-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
improper_ctypes_definitions = "warn"
redundant_imports = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_qualifications = "warn"
unused_unsafe = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
inconsistent_struct_constructor = "warn"
missing_safety_doc = "deny"
needless_continue = "warn"
not_unsafe_ptr_arg_deref = "deny"
redundant_closure_for_method_calls = "warn"
redundant_test_prefix = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"

[workspace.dependencies]
anofox-statistics = "0.10.1"
bitflags = { version = "2.9", default-features = false }
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
dtoolkit = "0.5.0"
mbench-core = { path = "crates/mbench-core" }
riscv = { version = "0.15.0", features = ["s-mode"] }
sbi-rt = { version = "0.0.3", features = ["legacy", "integer-impls"] }
sbi-spec = "0.0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
